<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobileGestalt</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1c1c1e; color: #f2f2f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #2c2c2e; border-radius: 16px; padding: 28px 24px; max-width: 500px; width: 100%; }
    h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    p { font-size: 13px; color: #8e8e93; margin: 0 0 20px; }
    a {
      display: block;
      background: #1c1c1e;
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      color: #0a84ff;
      word-break: break-all;
      text-decoration: none;
      line-height: 1.6;
    }
    a:active { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <h2>MobileGestalt</h2>
    <p>Tap to open the file path in Safari.</p>
    <a href="file://private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache/Library/Caches/com.apple.MobileGestalt.plist">
      file://private/var/containers/Shared/SystemGroup/systemgroup.com.apple.mobilegestaltcache/Library/Caches/com.apple.MobileGestalt.plist
    </a>
  </div>
</body>
</html>
