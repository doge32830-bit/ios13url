<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="iOS Schemes">
  <title>iOS URL Scheme Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📱 iOS URL Scheme Launcher</h1>
  <p class="subtitle">Tap any scheme to launch • Optimised for iOS 13</p>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search schemes…" autocapitalize="off" autocorrect="off" spellcheck="false">
  <select id="categoryFilter">
    <option value="all">All categories</option>
  </select>
</div>

<div class="custom-bar">
  <input type="text" id="customScheme" placeholder="myapp://custom/path?param=value" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button onclick="launchCustom()" class="launch-btn">Launch ↗</button>
</div>

<div id="stats" class="stats"></div>

<main id="grid"></main>

<div id="toast" class="toast hidden"></div>

<script src="schemes.js"></script>
<script src="app.js"></script>
</body>
</html>
